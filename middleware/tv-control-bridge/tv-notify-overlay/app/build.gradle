plugins {
    id 'com.android.application'
}

android {
    namespace 'com.happysong.tvnotify'
    compileSdk 34

    defaultConfig {
        applicationId "com.happysong.tvnotify"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Sengaja TANPA dependensi apa pun (tanpa AndroidX/Kotlin) supaya build kecil, cepat, dan tahan offline.
