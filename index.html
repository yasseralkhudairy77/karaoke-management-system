<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Song Karaoke Dashboard</title>
    <link rel="icon" href="data:," />

    <!-- Style utama untuk dashboard statis yang siap dipakai di GitHub Pages. -->
        <link rel="stylesheet" href="css/style.css?v=tv-adb-jujur" />

        <!--
          Opsi A: perapihan tata letak menu F&B (bilah sub-tab, bilah alat sticky,
          kepadatan daftar, fokus keyboard). Dimuat SETELAH style.css karena sifatnya
          menimpa. Untuk membalik perubahan ini cukup hapus baris <link> di bawah —
          tidak ada berkas lain yang perlu disentuh.
        -->
        <link rel="stylesheet" href="css/skin-fnb-layout.css?v=1" />

    <!--
      Perapihan modul Pengeluaran: paletnya disamakan dengan tema venue, emoji
      ikon dibuang, kartu/tabel dirapikan. Sama seperti skin F&B: hapus baris ini
      untuk kembali sepenuhnya ke tampilan lama.
    -->
    <link rel="stylesheet" href="css/skin-pengeluaran.css?v=1" />

    <!--
      Perapihan modul Stok: palet disamakan dengan tema venue, emoji dibuang,
      kartu/tabel/form dirapikan. Dimuat setelah style.css; untuk membatalkan,
      cukup hapus baris ini (tampilan lama kembali sepenuhnya).
    -->
    <link rel="stylesheet" href="css/skin-stok.css?v=1" />

    <!--
      Perapihan modul LC: kotak isian yang tadinya putih dikembalikan ke tema
      gelap, panel/kartu disamakan, sub-tab & tabel dirapikan. Dimuat setelah
      style.css; untuk membatalkan, cukup hapus baris ini.
    -->
    <link rel="stylesheet" href="css/skin-lc.css?v=1" />
  </head>
  <body>
    <!-- Header aplikasi tetap statis agar konteks halaman jelas sebelum JavaScript selesai dimuat. -->
    <header class="app-header">
      <div>
        <p class="app-kicker">Happy Song Karaoke</p>
        <h1>Dashboard Operasional</h1>
      </div>
      <span id="dataSourceBadge" class="app-badge">Memuat Data</span>
    </header>

    <main class="dashboard-shell">
      <!-- Pesan global, ringkasan tagihan, dan struk dirender oleh js/app.js. -->
      <div id="dashboardGlobal" class="dashboard-global" aria-live="polite"></div>

      <!-- Navigasi tab modul dashboard. -->
      <nav id="appTabs" class="app-tabs" role="tablist" aria-label="Navigasi modul dashboard"></nav>

      <!-- Panel konten tab aktif dirender oleh js/app.js. -->
      <div id="dashboardPanels" class="dashboard-panels"></div>
    </main>

    <!--
      Modul utama aplikasi.
      TODO: Saat integrasi Google Apps Script siap, orchestration tetap di sini
      dan sumber data contoh digantikan oleh data API di js/app.js.
    -->
    <script src="/tv-bridge-config.js"></script>
    <script type="module" src="js/app.js?v=tv-adb-jujur"></script>
  </body>
</html>
