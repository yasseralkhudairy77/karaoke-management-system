<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Song Karaoke Dashboard</title>
    <link rel="icon" href="data:," />

    <!-- Style utama dashboard. -->
    <link rel="stylesheet" href="css/style.css?v=trx-ui-polish" />

    <!--
      Opsi A: perapihan tata letak menu F&B (bilah sub-tab, bilah alat sticky,
      kepadatan daftar, fokus keyboard). Dimuat setelah style.css karena bersifat
      menimpa; hapus baris ini untuk kembali ke tampilan lama.
    -->
    <link rel="stylesheet" href="css/skin-fnb-layout.css?v=1" />

    <!--
      Perapihan modul Pengeluaran: palet disamakan dengan tema venue, emoji
      dibuang, kartu/tabel dirapikan. Hapus baris ini untuk membatalkan.
    -->
    <link rel="stylesheet" href="css/skin-pengeluaran.css?v=1" />

    <!--
      Perapihan modul Stok: palet disamakan dengan tema venue, emoji dibuang,
      kartu/tabel/form dirapikan. Hapus baris ini untuk membatalkan.
    -->
    <link rel="stylesheet" href="css/skin-stok.css?v=1" />

    <!--
      Perapihan modul LC: kotak isian dikembalikan ke tema gelap, panel/kartu
      disamakan, sub-tab & tabel dirapikan. Hapus baris ini untuk membatalkan.
    -->
    <link rel="stylesheet" href="css/skin-lc.css?v=1" />

    <!--
      Perapihan modul Laporan: sub-tab, kartu metrik, filter periode, dan tabel
      disamakan dengan tema venue. Hapus baris ini untuk membatalkan.
    -->
    <link rel="stylesheet" href="css/skin-laporan.css?v=1" />

    <!--
      Perapihan modul Transaksi: kotak isian dikembalikan ke tema gelap, sub-tab,
      filter, kartu & tabel dirapikan. Hapus baris ini untuk membatalkan.
    -->
    <link rel="stylesheet" href="css/skin-transaksi.css?v=1" />

    <!--
      Perbaikan tata letak baris Transaksi: kolom paling kanan (Aksi) tadinya
      meluber dan terpotong (hanya "Lihat" yang tampak).
    -->
    <link rel="stylesheet" href="css/skin-transaksi-layout.css?v=4" />

    <!--
      Redesain Header & Segmented Navigation Tabs:
      Tata letak terpadu, brand emblem, live clock, subtle live indicator, dan tab modern.
    -->
    <link rel="stylesheet" href="css/skin-header-nav.css?v=1" />
  </head>
  <body>
    <!-- Header aplikasi tetap statis agar konteks halaman jelas sebelum JavaScript selesai dimuat. -->
    <header class="app-header">
      <div class="app-brand">
        <div class="app-brand-logo">HS</div>
        <div class="app-brand-text">
          <p class="app-kicker">Happy Song Karaoke</p>
          <h1>Dashboard Operasional</h1>
        </div>
      </div>
      <div class="app-header-controls">
        <div id="liveClockDisplay" class="app-live-clock" aria-label="Waktu operasional">--:--:--</div>
        <span id="dataSourceBadge" class="app-badge"><span class="app-badge-dot"></span><span class="app-badge-text">Memuat Data</span></span>
      </div>
    </header>

    <main class="dashboard-shell">
      <!-- Pesan global, ringkasan tagihan, dan struk dirender oleh js/app.js. -->
      <div id="dashboardGlobal" class="dashboard-global" aria-live="polite"></div>

      <!-- Navigasi tab modul dashboard. -->
      <nav id="appTabs" class="app-tabs" role="tablist" aria-label="Navigasi modul dashboard"></nav>

      <!-- Panel konten tab aktif dirender oleh js/app.js. -->
      <div id="dashboardPanels" class="dashboard-panels"></div>
    </main>

    <!--
      Modul utama aplikasi.
      TODO: Saat integrasi Google Apps Script siap, orchestration tetap di sini
      dan sumber data contoh digantikan oleh data API di js/app.js.
    -->
    <script src="/tv-bridge-config.js"></script>
    <script type="module" src="js/app.js?v=trx-split-pill"></script>
  </body>
</html>
